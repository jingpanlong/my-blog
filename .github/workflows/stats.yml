name: 同步文章浏览量与点赞

# 每天定时把 Cloudflare Worker 里的浏览量 / 点赞数拉回来，
# 写入 data/post-stats.json 并提交；提交会触发 deploy.yml 重新部署，
# 从而让首页「精选文章」按最新热度自动重排。
on:
  schedule:
    - cron: '17 2 * * *' # 每天 10:17（北京时间）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats-sync
  cancel-in-progress: true

jobs:
  sync:
    name: 拉取统计并提交
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 同步浏览量 / 点赞
        run: python scripts/sync_stats.py

      - name: 提交变更
        run: |
          if git diff --quiet -- data/post-stats.json; then
            echo "统计数据无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/post-stats.json
          git commit -m "chore(stats): 同步浏览量/点赞数据"
          git push
