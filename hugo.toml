baseURL = 'https://my-blog-jingpanlong.pages.dev/'
locale = 'zh-cn'
title = '景盼龙 · 个人博客'
summaryLength = 60

# ============================================================
# 构建配置。
# 站点的「可编辑信息」（作者资料 / 社交 / 知识地图 / Hero 文案…）
# 全部在 data/site.yaml，由后台 /admin/ 维护，不要在这里改内容。
# ============================================================

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[outputFormats.JSON]
  mediaType = 'application/json'
  baseName = 'search-index'

[pagination]
  # 12 可被 3/2/1 列整除：列表页任意缩放宽度下每页都刚好铺满，不出现空白格
  pagerSize = 12

[taxonomies]
  tag = 'tags'
  category = 'categories'

[markup.goldmark.renderer]
  unsafe = true
