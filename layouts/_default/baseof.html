<!DOCTYPE html>
<html lang="zh-CN">
<head>
  {{ partial "head.html" . }}
</head>
<body{{ if .IsHome }} class="is-home"{{ end }}>
  <div class="nebula" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>
  <div class="starfield" aria-hidden="true"></div>

  {{ partial "header.html" . }}

  <main id="main" class="{{ if .IsHome }}home-main{{ else }}container{{ end }}">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
  {{ partial "search-modal.html" . }}
  {{ partial "favorites-modal.html" . }}
  {{ partial "auth-modal.html" . }}

  <button id="to-top" class="to-top" aria-label="回到顶部" title="回到顶部">↑</button>

  <script src="/js/main.js" defer></script>
  <script src="/js/motion.js" defer></script>
</body>
</html>
