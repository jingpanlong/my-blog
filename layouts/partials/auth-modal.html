{{ if hugo.Data.site.commentApi }}
<div class="auth-modal" id="auth-modal" hidden>
  <div class="auth-card glass" role="dialog" aria-modal="true" aria-label="登录或注册">
    <button type="button" class="auth-close" id="auth-close" aria-label="关闭">×</button>
    <h3 class="auth-title" id="auth-title">登录</h3>
    <div class="auth-tabs" id="auth-tabs">
      <button type="button" class="auth-tab active" data-tab="login">登录</button>
      <button type="button" class="auth-tab" data-tab="register">注册</button>
    </div>
    <form class="auth-form" id="auth-form" novalidate>
      <div class="auth-field auth-avatar-field" id="auth-avatar-field" hidden>
        <span class="af-label">选择头像</span>
        <div class="avatar-grid" id="auth-avatar-grid"></div>
      </div>
      <div class="auth-field" id="auth-name-field" hidden>
        <input class="cf-input" id="auth-name" type="text" maxlength="24" placeholder="昵称（登录时也可用昵称）" autocomplete="nickname" aria-label="昵称">
      </div>
      <input class="cf-input" id="auth-email" type="text" placeholder="邮箱 / 昵称" autocomplete="username" aria-label="邮箱或昵称">
      <input class="cf-input" id="auth-pw" type="password" placeholder="密码（至少 8 位）" autocomplete="current-password" aria-label="密码">
      <div class="auth-field" id="auth-pw2-field" hidden>
        <input class="cf-input" id="auth-pw2" type="password" placeholder="确认密码" autocomplete="new-password" aria-label="确认密码">
      </div>
      <div class="auth-field auth-reset-field" id="auth-reset-field" hidden>
        <input class="cf-input" id="auth-reset-pw" type="password" placeholder="新密码（至少 8 位）" autocomplete="new-password" aria-label="新密码">
        <input class="cf-input" id="auth-reset-pw2" type="password" placeholder="确认新密码" autocomplete="new-password" aria-label="确认新密码">
      </div>
      <span class="cf-msg auth-msg" id="auth-msg" role="status"></span>
      <div class="auth-devlinks" id="auth-devlinks" hidden></div>
      <div class="auth-actions">
        <a href="#" class="auth-forgot" id="auth-to-forgot">忘记密码？</a>
        <button type="submit" class="cf-submit auth-submit" id="auth-submit">登录</button>
      </div>
      <a href="#" class="auth-back" id="auth-to-login" hidden>← 返回登录</a>
    </form>
  </div>
</div>
{{ end }}
