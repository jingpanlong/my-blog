<header class="site-header">
  <div class="nav-inner">
    <a class="brand" href="/" aria-label="{{ .Site.Title }} 首页">
      <span class="brand-logo">{{ hugo.Data.site.brandMark }}</span>
      <span class="brand-copy">
        <b>{{ hugo.Data.site.author }}</b>
        <small>{{ hugo.Data.site.brandTagline }}</small>
      </span>
    </a>

    <nav class="nav-links" aria-label="主导航">
      <a href="/" {{ if .IsHome }}class="active"{{ end }}>首页</a>
      <a href="/posts/" {{ if and (eq .Section "posts") (not .IsHome) }}class="active"{{ end }}>文章</a>
      <a href="/projects/" {{ if eq .Section "projects" }}class="active"{{ end }}>项目</a>
      <a href="/tags/随笔/" {{ if and (eq .Section "tags") (in .RelPermalink "随笔") }}class="active"{{ end }}>随笔</a>
      <a href="/about/" {{ if eq .RelPermalink "/about/" }}class="active"{{ end }}>关于我</a>
    </nav>

    <div class="nav-actions">
      <button id="search-toggle" class="search-trigger" type="button" aria-label="搜索文章">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span class="st-text">搜索感兴趣的内容…</span>
        <kbd>⌘K</kbd>
      </button>

      <button id="favs-toggle" class="icon-btn" type="button" aria-label="我的收藏" title="我的收藏">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9 6.8 19l1-5.8L3.6 9.1l5.8-.8z"/></svg>
        <span class="badge" id="favs-count" hidden>0</span>
      </button>

      <button id="theme-toggle" class="icon-btn" type="button" aria-label="切换深浅色" title="切换深浅色">
        <svg class="i-sun" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </div>
</header>
