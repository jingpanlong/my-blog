<header class="site-header glass">
  <div class="nav-inner">
    <a class="brand" href="/" aria-label="{{ .Site.Title }}">
      <span class="brand-mark"></span>
      <span class="brand-text">{{ .Site.Title }}</span>
    </a>

    <nav class="nav-links" aria-label="主导航">
      <a href="/" {{ if .IsHome }}class="active"{{ end }}>首页</a>
      <a href="/posts/" {{ if eq .Section "posts" }}class="active"{{ end }}>文章</a>
      <a href="/projects/" {{ if eq .Section "projects" }}class="active"{{ end }}>作品集</a>
      <a href="/about/" {{ if eq .RelPermalink "/about/" }}class="active"{{ end }}>关于</a>
      <a href="/tags/" {{ if eq .RelPermalink "/tags/" }}class="active"{{ end }}>标签</a>
      <a href="/archive/" {{ if eq .RelPermalink "/archive/" }}class="active"{{ end }}>归档</a>
    </nav>

    <div class="nav-actions">
      <div class="social-mini">
        {{ range .Site.Params.social }}
          <a class="social-btn" href="{{ .url }}" title="{{ .name }}{{ with .handle }} · {{ . }}{{ end }}"
             {{ if ne .url "#" }}target="_blank" rel="noopener"{{ end }}>{{ partial "icon.html" .icon }}</a>
        {{ end }}
      </div>
      <button id="search-toggle" class="icon-btn" type="button" aria-label="搜索" title="搜索">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="切换深浅色" title="切换深浅色">
        <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </div>
</header>
