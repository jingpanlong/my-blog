<footer class="site-footer">
  <div class="foot-inner">
    <div class="foot-brand">
      <img class="brand-logo" src="/img/logo-mark.png" alt="{{ hugo.Data.site.author }}">
      <div class="foot-id">
        <b>{{ hugo.Data.site.author }}</b>
        <small>{{ hugo.Data.site.subtitle }}</small>
      </div>
    </div>

    <nav class="foot-nav" aria-label="页脚导航">
      <a href="/">首页</a>
      <a href="/posts/">文章</a>
      <a href="/projects/">项目</a>
      <a href="/tags/">标签</a>
      <a href="/archive/">归档</a>
      <a href="/about/">关于我</a>
    </nav>

    <div class="foot-right">
      <div class="foot-social">
        {{ partial "social-links.html" }}
      </div>
      <div class="foot-copy">
        <span>Stay Curious · Keep Building</span>
        <span>© {{ now.Year }} {{ hugo.Data.site.author }}</span>
      </div>
    </div>
  </div>
  <p class="footer-note">由 <strong>Hugo</strong> 构建 · 部署于 <strong>Cloudflare Pages</strong></p>
</footer>
