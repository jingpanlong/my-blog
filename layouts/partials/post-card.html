<article class="post-card glass">
  <div class="post-card-top">
    <time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    {{ with .Params.tags }}<span class="tags">{{ range first 3 . }}<a class="tag-chip" href="/tags/{{ . | urlize }}/">{{ . }}</a>{{ end }}</span>{{ end }}
  </div>
  <h3 class="post-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
  <p class="post-summary">{{ .Summary | plainify | truncate 90 }}</p>
  <div class="post-card-foot">
    <span class="read-time">{{ .ReadingTime }} {{ hugo.Data.site.ui.readTime | default "分钟阅读" }}</span>
    <span class="pc-views" data-view-path="{{ .RelPermalink }}" title="浏览量">
      <svg class="ic-eye" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
      <span class="view-n">—</span>
    </span>
  </div>
</article>
