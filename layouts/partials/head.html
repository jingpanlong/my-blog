<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ hugo.Data.site.description }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">

<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ hugo.Data.site.description }}{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
{{ with hugo.Data.site.avatar }}<meta property="og:image" content="{{ . | absURL }}">{{ end }}
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="/css/style.css">
<link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="/index.xml">
{{ with hugo.Data.site.avatar }}<link rel="icon" href="{{ . }}">{{ end }}
{{ with hugo.Data.site.likeApi }}<meta name="like-api" content="{{ . }}">{{ end }}

{{/* 防闪烁：在首屏绘制前确定主题（支持 ?theme=light|dark 覆盖，便于分享与测试） */}}
<script>
  (function () {
    try {
      var q = new URLSearchParams(location.search).get('theme');
      var t = (q === 'light' || q === 'dark') ? q : (localStorage.getItem('theme') || 'dark');
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
