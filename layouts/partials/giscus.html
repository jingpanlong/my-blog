{{ if hugo.Data.site.giscusRepo }}
<section class="comments glass" id="comments">
  <h2 class="comments-title">评论区</h2>
  <p class="comments-hint">使用 GitHub 账号登录即可留言。若评论未显示，请先在仓库开启 Discussions 并安装 Giscus App。</p>

  {{/* 错误兜底面板：捕获 giscus 加载/提交偶发失败（多为 GitHub 限流或网络抖动），提供重试而不是一片空白 */}}
  <div class="giscus-error" id="giscus-error" hidden>
    <div>评论组件加载失败：<span class="ge-msg" id="giscus-error-msg">未知错误</span></div>
    <button type="button" class="giscus-retry" id="giscus-retry">重试</button>
  </div>

  <script src="https://giscus.app/client.js"
    id="giscus-script"
    data-repo="{{ hugo.Data.site.giscusRepo }}"
    data-repo-id="{{ hugo.Data.site.giscusRepoId }}"
    data-category="{{ hugo.Data.site.giscusCategory }}"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="bottom"
    data-theme="dark"
    data-lang="zh-CN"
    data-loading="lazy"
    crossorigin="anonymous"
    async>
  </script>

  <script>
    (function () {
      function showGiscusError(msg) {
        var msgEl = document.getElementById('giscus-error-msg');
        var box = document.getElementById('giscus-error');
        if (msgEl) msgEl.textContent = (msg && ('' + msg).slice(0, 300)) || '未知错误';
        if (box) box.hidden = false;
      }
      // giscus 派发的 CustomEvent
      document.addEventListener('giscusError', function (e) {
        var d = e && e.detail;
        showGiscusError(typeof d === 'string' ? d : (d && d.message) ? d.message : JSON.stringify(d));
      });
      // giscus 通过 postMessage 上报的错误
      window.addEventListener('message', function (ev) {
        var d = ev && ev.data;
        if (d && d.giscus && d.giscus.error) {
          var err = d.giscus.error;
          showGiscusError(typeof err === 'string' ? err : (err && err.message) ? err.message : JSON.stringify(err));
        }
      });
      // 重试：移除旧 iframe 并重新注入 giscus 脚本
      var retry = document.getElementById('giscus-retry');
      if (retry) {
        retry.addEventListener('click', function () {
          var f = document.querySelector('iframe.giscus-frame');
          if (f && f.parentNode) f.parentNode.removeChild(f);
          var old = document.getElementById('giscus-script');
          if (old) {
            var clone = old.cloneNode(true);
            old.parentNode.insertBefore(clone, old);
            old.parentNode.removeChild(old);
          }
          var box = document.getElementById('giscus-error');
          if (box) box.hidden = true;
        });
      }
    })();
  </script>
</section>
{{ end }}
