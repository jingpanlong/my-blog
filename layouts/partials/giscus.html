{{ if .Site.Params.giscusRepo }}
<section class="comments glass" id="comments">
  <h2 class="comments-title">评论区</h2>
  <p class="comments-hint">使用 GitHub 账号登录即可留言。若评论未显示，请先在仓库开启 Discussions 并安装 Giscus App。</p>
  <script src="https://giscus.app/client.js"
    data-repo="{{ .Site.Params.giscusRepo }}"
    data-repo-id="{{ .Site.Params.giscusRepoId }}"
    data-category="{{ .Site.Params.giscusCategory }}"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="bottom"
    data-theme="dark"
    data-lang="zh-CN"
    data-loading="lazy"
    crossorigin="anonymous"
    async>
  </script>
</section>
{{ end }}
