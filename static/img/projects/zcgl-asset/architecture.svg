<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfeff"/><stop offset="1" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/><stop offset="1" stop-color="#dcfce7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e1b4b">锦纷资产管理系统 · 架构</text>
  <text x="480" y="68" text-anchor="middle" font-size="13" fill="#64748b">客户端静默采集 → 内网服务端入库 → 报表导出</text>

  <!-- 客户端 -->
  <rect x="40" y="120" width="230" height="180" rx="16" fill="url(#g1)" stroke="#c7d2fe"/>
  <text x="155" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#3730a3">客户端 · client.py</text>
  <text x="60" y="184" font-size="12.5" fill="#4338ca">· 硬件信息采集（platform / psutil）</text>
  <text x="60" y="208" font-size="12.5" fill="#4338ca">· 网络与主机名 · MAC / IP</text>
  <text x="60" y="232" font-size="12.5" fill="#4338ca">· 使用人 / 部门 / 联系电话</text>
  <text x="60" y="256" font-size="12.5" fill="#4338ca">· customtkinter 图形界面</text>
  <text x="60" y="280" font-size="12.5" fill="#4338ca">· HTTP 上报至内网接口</text>

  <!-- 服务端 -->
  <rect x="365" y="120" width="230" height="180" rx="16" fill="url(#g2)" stroke="#a5f3fc"/>
  <text x="480" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#155e75">服务端 · server.py</text>
  <text x="385" y="184" font-size="12.5" fill="#0e7490">· Flask 路由</text>
  <text x="385" y="208" font-size="12.5" fill="#0e7490">· POST /api/report_asset</text>
  <text x="385" y="232" font-size="12.5" fill="#0e7490">· 请求校验与字段映射</text>
  <text x="385" y="256" font-size="12.5" fill="#0e7490">· 写入 SQLite（assets 表）</text>
  <text x="385" y="280" font-size="12.5" fill="#0e7490">· pandas 汇总与导出</text>

  <!-- 数据与导出 -->
  <rect x="690" y="120" width="230" height="180" rx="16" fill="url(#g3)" stroke="#bbf7d0"/>
  <text x="805" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">资产库与报表</text>
  <text x="710" y="184" font-size="12.5" fill="#15803d">· SQLite：asset_database.db</text>
  <text x="710" y="208" font-size="12.5" fill="#15803d">· 设备台账（主机/CPU/内存）</text>
  <text x="710" y="232" font-size="12.5" fill="#15803d">· 按部门 / 使用人归集</text>
  <text x="710" y="256" font-size="12.5" fill="#15803d">· Excel 报表导出</text>
  <text x="710" y="280" font-size="12.5" fill="#15803d">· 便于盘点与审计</text>

  <!-- 箭头 -->
  <line x1="270" y1="210" x2="360" y2="210" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="595" y1="210" x2="685" y2="210" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="315" y="200" text-anchor="middle" font-size="11.5" fill="#6366f1">HTTP POST</text>
  <text x="640" y="200" text-anchor="middle" font-size="11.5" fill="#6366f1">SQL / DataFrame</text>

  <text x="480" y="352" text-anchor="middle" font-size="12.5" fill="#64748b">部署于企业内网 · 数据不出内网 · 面向 IT 设备资产盘点与台账管理</text>
</svg>
